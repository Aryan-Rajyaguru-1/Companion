name=CompanionRelay
version=1.0.0
author=Companion
maintainer=Companion
sentence=Join your ESP32 to a Companion relay hub and receive firmware over the internet.
paragraph=CompanionRelay dials a self-hosted Companion relay hub OUTBOUND, so your board needs no inbound ports and can be re-flashed from anywhere on the internet. A push is validated by the hub (per-device secret), streamed to the board, and the board verifies the image MD5 before rebooting. Push with: companion relay push --hub wss://your-host --device <id> image.bin
category=Communication
