sentence=Join your ESP32 to a Companion relay hub through an outbound, authenticated link.
paragraph=CompanionRelay dials a self-hosted Companion relay hub OUTBOUND, so your board needs no inbound ports. It provides the authenticated WebSocket transport and per-board secret provisioning; it does not implement Update/ACK. RelayDevice.ino is the complete OTA receiver. Push with: companion relay push --hub wss://your-host --device <id> image.bin
