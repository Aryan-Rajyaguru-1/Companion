name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  cli:
    name: CLI binaries (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  targets: 'linux-amd64 linux-arm64' }
          - { os: windows-latest, targets: 'windows-amd64.exe windows-arm64.exe' }
          - { os: macos-latest,   targets: 'darwin-amd64 darwin-arm64' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          # go.mod/go.sum live in companion-cli/, not the repo root — without
          # this the build-cache restore warns and is skipped every run.
          cache-dependency-path: companion-cli/go.sum
      - name: Build
        working-directory: companion-cli
        shell: bash
        env:
          # Tag runs stamp the real version (the Makefile's git describe does
          # this for local builds). Without it every released binary reported
          # "1.0.0" forever, breaking the bug template's `companion version`
          # ask.
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: |
          mkdir -p ../dist-cli
          for t in ${{ matrix.targets }}; do
            # "linux-amd64" | "windows-amd64.exe" — os is everything before the
            # FIRST DASH, the rest is "arch" plus an optional ".exe" suffix.
            # ${t#*.} (first DOT) was the old bug: with no dot in the target it
            # left arch as the whole string, so Go saw GOARCH=linux-amd64 and
            # every CLI job failed with "unsupported GOOS/GOARCH pair".
            os=${t%%-*}
            rest=${t#*-}
            case "$rest" in
              *.*) arch=${rest%.*}; ext=".${rest##*.}" ;;
              *)   arch=$rest;      ext=""
            esac
            name=companion-$os-$arch$ext
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X github.com/companion-ide/companion-cli/cmd.CLIVersion=$VERSION" -o "../dist-cli/$name" . \
              || { echo "::error::build failed for GOOS=$os GOARCH=$arch"; exit 1; }
          done
          ls -la ../dist-cli
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.os }}
          path: dist-cli/
          if-no-files-found: error

  ide:
    name: IDE installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  path: 'release/*.AppImage release/*.deb' }
          - { os: windows-latest, path: 'release/*.exe' }
          - { os: macos-latest,   path: 'release/*.dmg' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build installers
        working-directory: companion-ide
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Verify the expected installer exists for this OS
        working-directory: companion-ide
        shell: bash
        run: |
          # electron-builder's output naming differs per OS; fail loudly here
          # rather than letting an empty release/ propagate to the release page.
          # nullglob + a quoted array: the produced filenames contain SPACES
          # ("Companion IDE Setup 1.0.0.exe"), and an unquoted `for f in $glob`
          # word-splits them, so a SUCCESSFUL build reported failure.
          shopt -s nullglob
          case "${{ matrix.os }}" in
            ubuntu-latest)  files=(release/*.AppImage release/*.deb) ;;
            windows-latest) files=(release/*.exe) ;;
            macos-latest)   files=(release/*.dmg) ;;
          esac
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no installer was produced — electron-builder failed for ${{ matrix.os }}"
            ls -la release 2>/dev/null || echo "(no release/ directory)"
            exit 1
          fi
          echo "installers produced:"
          ls -la "${files[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: ide-${{ matrix.os }}
          # Installers only: release/ also holds win-unpacked/ (a full unpacked
          # app, ~250 MB) which would otherwise ride into the release page.
          path: |
            companion-ide/release/*.exe
            companion-ide/release/*.AppImage
            companion-ide/release/*.deb
            companion-ide/release/*.dmg
          # An IDE build that produces nothing must FAIL the job. The v0.1.0-alpha
          # release shipped with only Linux-arm64 IDE artifacts while both the
          # Windows and macOS jobs reported success — `upload-artifact`'s default
          # `warn` on empty matches let a broken electron-builder run pass
          # silently, so testers had no GUI installer to download at all.
          if-no-files-found: error

  publish:
    name: Attach to GitHub Release
    needs: [cli, ide]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true, path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
